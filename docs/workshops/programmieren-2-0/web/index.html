<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museumsobjekte - Hans Gross Kriminalmuseum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Hans Gross Kriminalmuseum</h1>
      <p class="subtitle">Workshop-Objekte</p>
    </header>

    <!-- Filter (Tutorial Teil 6) -->
    <div class="filter-container">
      <label for="kategorie-filter">Kategorie:</label>
      <select id="kategorie-filter">
        <option value="">Alle anzeigen</option>
        <!-- Optionen werden dynamisch befuellt -->
      </select>
      <span class="result-count" id="result-count"></span>
    </div>

    <!-- Objekt-Karten -->
    <div class="cards" id="cards-container">
      <!-- Karten werden per JavaScript eingefuegt -->
    </div>

    <footer>
      <p>Daten: Hans Gross Kriminalmuseum, Universitaet Graz</p>
      <p>Workshop: AI Coding Literacy - Programmieren 2.0</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
