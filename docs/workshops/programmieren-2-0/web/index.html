<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kriminalmuseum Objekte</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        /* Suchfeld */
        .search-container {
            margin-bottom: 2rem;
        }

        #suchfeld {
            width: 100%;
            max-width: 400px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        #suchfeld:focus {
            outline: none;
            border-color: #3498db;
        }

        .result-count {
            margin-top: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        /* Karten-Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.75rem;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .tag-type {
            background-color: #e8f4fd;
            color: #2980b9;
        }

        .tag-year {
            background-color: #fef3e2;
            color: #d35400;
        }

        .tag-material {
            background-color: #e8f8f5;
            color: #1abc9c;
        }

        .card-description {
            font-size: 0.9rem;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Keine Ergebnisse */
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hans Gross Kriminalmuseum</h1>
            <p class="subtitle">Workshop: Programmieren 2.0 – Block 4 Musterlösung</p>
        </header>

        <div class="search-container">
            <input 
                type="text" 
                id="suchfeld" 
                placeholder="Suche nach Titel, Typ oder Material..."
                autocomplete="off"
            >
            <p class="result-count" id="result-count"></p>
        </div>

        <div class="cards" id="cards-container">
            <!-- Karten werden per JavaScript eingefügt -->
        </div>

        <footer>
            <p>Daten: <a href="https://kriminalmuseum.uni-graz.at/" target="_blank">Hans Gross Kriminalmuseum</a>, Universität Graz</p>
            <p>Workshop: <a href="https://github.com/DigitalHumanitiesCraft/ai-coding-literacy" target="_blank">AI Coding Literacy</a></p>
        </footer>
    </div>

    <script>
        // =============================================================================
        // KONFIGURATION
        // =============================================================================
        
        // Pfad zur JSON-Datei - anpassen falls nötig
        // HTML liegt in: workshops/programmieren-2-0/web/
        // Daten liegen in: data/kriminalmuseum/
        const DATEN_URL = '../../../data/kriminalmuseum/workshop_objekte.json';

        // Alternative: Datei im selben Ordner (für Workshop-Teilnehmende)
        // const DATEN_URL = 'workshop_objekte.json';

        // =============================================================================
        // GLOBALE VARIABLEN
        // =============================================================================
        
        let alleObjekte = [];

        // =============================================================================
        // FUNKTIONEN
        // =============================================================================

        /**
         * Erstellt eine Karte für ein Objekt
         */
        function erstelleKarte(objekt) {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Beschreibung kürzen falls nötig
            let beschreibung = objekt.description || '';
            // Nur den Description-Teil extrahieren falls vorhanden
            if (beschreibung.includes('Description:')) {
                const start = beschreibung.indexOf('Description:') + 12;
                const end = beschreibung.indexOf('|', start);
                beschreibung = end > 0 ? beschreibung.substring(start, end).trim() : beschreibung.substring(start).trim();
            }
            
            card.innerHTML = `
                <h2 class="card-title">${objekt.title || 'Ohne Titel'}</h2>
                <div class="card-meta">
                    ${objekt.type ? `<span class="tag tag-type">${objekt.type}</span>` : ''}
                    ${objekt.year ? `<span class="tag tag-year">${objekt.year}</span>` : ''}
                    ${objekt.material ? `<span class="tag tag-material">${objekt.material}</span>` : ''}
                </div>
                <p class="card-description">${beschreibung}</p>
            `;
            
            return card;
        }

        /**
         * Zeigt die Objekte an (optional gefiltert)
         */
        function zeigeObjekte(objekte) {
            const container = document.getElementById('cards-container');
            const resultCount = document.getElementById('result-count');
            
            // Container leeren
            container.innerHTML = '';
            
            if (objekte.length === 0) {
                container.innerHTML = '<div class="no-results">Keine Objekte gefunden.</div>';
                resultCount.textContent = '0 Objekte';
                return;
            }
            
            // Karten erstellen und einfügen
            objekte.forEach(objekt => {
                container.appendChild(erstelleKarte(objekt));
            });
            
            // Anzahl aktualisieren
            resultCount.textContent = `${objekte.length} Objekt${objekte.length !== 1 ? 'e' : ''}`;
        }

        /**
         * Filtert Objekte nach Suchbegriff
         */
        function filtereObjekte(suchbegriff) {
            if (!suchbegriff.trim()) {
                return alleObjekte;
            }
            
            const begriff = suchbegriff.toLowerCase();
            
            return alleObjekte.filter(objekt => {
                const titel = (objekt.title || '').toLowerCase();
                const typ = (objekt.type || '').toLowerCase();
                const material = (objekt.material || '').toLowerCase();
                const beschreibung = (objekt.description || '').toLowerCase();
                
                return titel.includes(begriff) || 
                       typ.includes(begriff) || 
                       material.includes(begriff) ||
                       beschreibung.includes(begriff);
            });
        }

        /**
         * Event-Handler für Sucheingabe
         */
        function onSuche(event) {
            const suchbegriff = event.target.value;
            const gefilterteObjekte = filtereObjekte(suchbegriff);
            zeigeObjekte(gefilterteObjekte);
        }

        /**
         * Lädt die Daten und initialisiert die Seite
         */
        async function initialisieren() {
            try {
                // Daten laden
                const response = await fetch(DATEN_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                alleObjekte = await response.json();
                
                // Objekte anzeigen
                zeigeObjekte(alleObjekte);
                
                // Such-Event registrieren
                document.getElementById('suchfeld').addEventListener('input', onSuche);
                
            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
                document.getElementById('cards-container').innerHTML = `
                    <div class="no-results">
                        <p><strong>Fehler beim Laden der Daten</strong></p>
                        <p>${error.message}</p>
                        <p style="margin-top: 1rem; font-size: 0.9rem;">
                            Stelle sicher, dass:<br>
                            1. Die Datei <code>workshop_objekte.json</code> existiert<br>
                            2. Der Pfad in DATEN_URL korrekt ist<br>
                            3. Du Live Server verwendest (nicht die Datei direkt öffnest)
                        </p>
                    </div>
                `;
            }
        }

        // =============================================================================
        // START
        // =============================================================================
        
        // Seite initialisieren wenn DOM geladen ist
        document.addEventListener('DOMContentLoaded', initialisieren);
    </script>
</body>
</html>
